<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep violet #1E0835 -->
  <rect width="512" height="512" rx="96" fill="#1E0835"/>

  <!-- Subtle purple highlight top-left -->
  <defs>
    <radialGradient id="hl" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6B21A8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1E0835" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#hl)"/>

  <!-- H — left vertical bar -->
  <rect x="118" y="118" width="78" height="270" rx="14" fill="white"/>
  <!-- H — right vertical bar -->
  <rect x="316" y="118" width="78" height="270" rx="14" fill="white"/>
  <!-- H — crossbar -->
  <rect x="118" y="213" width="276" height="78" rx="14" fill="white"/>

  <!-- Coral accent pill — anchored bottom-left of the H -->
  <rect x="118" y="352" width="108" height="36" rx="10" fill="#E02060"/>
</svg>
