<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep violet -->
  <rect width="512" height="512" rx="96" fill="#1E0835"/>

  <!-- Inner subtle gradient overlay -->
  <rect width="512" height="512" rx="96" fill="url(#grad)" opacity="0.4"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B21A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E0835" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- H letter — white, bold, centered -->
  <!-- Left vertical bar -->
  <rect x="118" y="118" width="80" height="276" rx="12" fill="white"/>
  <!-- Right vertical bar -->
  <rect x="314" y="118" width="80" height="276" rx="12" fill="white"/>
  <!-- Crossbar -->
  <rect x="118" y="216" width="276" height="80" rx="12" fill="white"/>

  <!-- Coral accent pill — bottom left corner, small -->
  <rect x="118" y="358" width="100" height="36" rx="10" fill="#E02060"/>
</svg>
